name: Currency check

# Monthly, and on demand from the Actions tab. Opens or updates one issue
# listing anything overdue, due soon, or quoting a figure that has changed.
# It never edits content: people update figures and documents through
# reviewed pull requests.
on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Run check
        id: check
        run: |
          set +e
          python3 scripts/check_currency.py > report.md
          echo "found=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Currency check: items to review"
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ "${{ steps.check.outputs.found }}" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Nothing is due. Closing."
              gh issue close "$number"
            fi
          elif [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi
