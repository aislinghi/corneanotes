name: Screen test

# Every item ever reported as missed must still be found by the screen.
on:
  pull_request:
    paths:
      - "reviews/screen/**"
      - "reviews/missed/**"
      - "scripts/screen_literature.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-test:
    name: Screen test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/screen_literature.py test
