name: Patient data check

# Runs on every push to every branch and on every pull request. Make it a
# required status check in the branch ruleset so nothing can merge if it fails.
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patient-data-check:
    name: Patient data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_patient_data.py

  document-check:
    name: Document check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/check_documents.py
