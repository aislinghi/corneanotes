  local_formulary_link: ""
  local_sensitivity_data: "EXAMPLE: where local resistance / antibiogram data is held"
  bacterial_keratitis:                 # EXAMPLE indication; add one block per indication
    first_line: "EXAMPLE: local first-line regimen"
    alternative: "EXAMPLE: local alternative, e.g. for allergy"
    notes: ""
