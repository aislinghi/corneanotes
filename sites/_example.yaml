# Example service file. Copy this file, rename it after your service and fill it in.
# Every key here can be used in a document as {{site.<key>}}.

name: "Example Eye Unit, Example NHS Foundation Trust"
department: "Cornea Service"
country: "UK"

contacts:
  main_phone: "01234 567890"           # EXAMPLE: replace with your number
  urgent_phone: "01234 567891"         # EXAMPLE: replace with your number
  hours: "Monday to Friday, 9am to 5pm"

urgent_access: |
  EXAMPLE: describe how a patient should get urgent help during working hours.

out_of_hours: |
  EXAMPLE: describe what a patient should do out of hours, e.g. which
  emergency department or eye casualty to attend.

pifu:                                  # patient-initiated follow-up (PIFU)
  phone: "01234 567892"                # EXAMPLE: your PIFU line
  how_to_contact: |
    EXAMPLE: how a patient on PIFU gets back in touch (phone, email, online form)
    and how quickly they can expect a reply.
  duration: "EXAMPLE: how long a patient stays on PIFU before discharge"

formulary:                             # local antimicrobial choices, used by guidelines as {{site.formulary.<indication>.<field>}}
  # Agreed with this service's own microbiology / antimicrobial stewardship team.
  # Drug choices, doses and sensitivities differ between areas, so they live here, not in the shared guideline.
  approved_by: "EXAMPLE: role of local microbiology approver"
  approved_on:                         # YYYY-MM-DD
  next_review_due:                     # YYYY-MM-DD
  local_formulary_link: ""
  local_sensitivity_data: "EXAMPLE: where local resistance / antibiogram data is held"
  stocked:                             # agents from evidence/ophthalmology/cornea/ophthalmic-antimicrobials.yaml this service stocks
    - example_agent
  bacterial_keratitis:                 # EXAMPLE indication; add one block per indication
    first_line: "EXAMPLE: local first-line regimen"
    alternative: "EXAMPLE: local alternative, e.g. for allergy"
    notes: ""

business_case:                         # local figures that genuinely differ between services
  activity: "EXAMPLE: annual activity relevant to the case"
  finance_contact: "EXAMPLE: role, not a personal name"

videos:                                # links to this service's recorded videos, by document
  # corneal-cross-linking: "https://..."

format:
  template: ""                         # name of this service's document template, when available
