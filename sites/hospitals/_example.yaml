# Hospital or clinic level. EXAMPLE file: copy, rename and fill in with your own details.
# This example is fictional. Its phone numbers are in the range Ofcom reserves
# for fiction (01632 960xxx), so they cannot reach anyone.
# Every key here (and inherited from the trust, networks and country) can be
# used in a document as {{site.<key>}}.
level: hospital
name: "Example Eye Unit"
trust: example-trust                   # file name in sites/trusts/ without .yaml
department: "Cornea Service"

contacts:
  main_phone: "01632 960 000"
  urgent_phone: "01632 960 001"
  hours: "Monday to Friday, 8:30am to 5pm"

urgent_access: |
  Our eye emergency telephone line is open Monday to Friday, 8:30am to 5pm, and
  Saturday and Sunday, 9am to 1pm. A nurse or doctor will advise you, and will
  arrange for you to be seen the same day if needed.

out_of_hours: |
  Outside these hours, call NHS 111. If you have sudden loss of vision or severe
  pain, go to your nearest emergency department.

pifu:                                  # patient-initiated follow-up (PIFU)
  phone: "01632 960 002"
  how_to_contact: |
    Call our PIFU line, Monday to Friday, 9am to 4pm. Leave a message if no one
    answers, and we will call you back within two working days.
  duration: "12 months"

formulary:
  stocked:                             # agents from evidence/uk/ophthalmology/cornea/ophthalmic-antimicrobials.yaml stocked here
    - example_agent

amniotic_membrane:                     # products differ between units
  types_used: |
    We use frozen amniotic membrane supplied by NHS Blood and Transplant. It is
    kept frozen until it is needed.
  antibiotic_traces: "The membrane may contain tiny traces of the antibiotics used to clean it during processing. Please tell us if you are allergic to any antibiotic."

aftercare:                             # this unit's own practice after each procedure
  dalk:
    follow_up: "We will see you within a week of your operation, and then regularly, usually about six times in the first year."
    drops: "We usually reduce your drops gradually over the first year."
    stitches: "We may remove some stitches from about three months after surgery. We usually remove all the stitches after about a year."
    time_off_work: "Most people take about two weeks off work."
  cxl:
    pain_relief: "We will give you pain relief tablets and eye drops to take home."
    follow_up: "We will see you about a week after treatment to check the surface has healed and remove the bandage contact lens, and then again at 3 to 6 months."
    time_off_work: "Most people take about a week off work or school, or two weeks if they do a lot of close or screen work."
  pk:
    follow_up: "We will see you within a week of your operation, and then every few months for the first two years."
    drops: "We usually reduce your steroid drops gradually over the first year, and many people stay on a low dose for longer."
    stitches: "We usually start removing stitches about a year after surgery, a few at a time in clinic."
    time_off_work: "Most people take two to four weeks off work, depending on their job."
  ek:
    posture: "After the operation, please lie on your back as much as you can for the rest of the day and that night. This helps the air bubble hold the new layer in place."
    follow_up: "We will check your eye the day after surgery and again within a week, and then every few months for the first year."
    drops: "We usually reduce your steroid drops gradually over the first year."
    time_off_work: "Most people take one to two weeks off work."
  abrasion:
    contact_lenses: "Do not wear contact lenses until your eye has completely healed and feels normal, and for at least a week after that. Use a new pair of lenses and a new case when you start again."
    follow_up: "Most people do not need another appointment. We will tell you if we need to see you again."
  microbial_keratitis:
    follow_up: "We will usually see you again within one to three days to check the treatment is working, and then regularly until the infection has cleared."
  pterygium:
    follow_up: "We will see you about three to four weeks after the operation."
    drops: "You will use antibiotic and steroid drops. We usually stop the antibiotic after one to two weeks and reduce the steroid drops over about a month or two."
    time_off_work: "Most people take about a week off work, or longer if they work in a dusty place."
  recurrent_erosion:
    after_procedure: "After a procedure, your eye is likely to be painful and sensitive to light for a few days. We will put in a bandage contact lens and check your eye after about a week. Most people take about a week off work."
  suture_removal:
    follow_up: "We will usually check your eye about a week after stitches are removed, and measure your eye for glasses about six weeks later."
  band_keratopathy:
    after_procedure: "Your eye is likely to be sore, watery and sensitive to light for a few days, and your vision will be blurred at first. You can take paracetamol or ibuprofen if needed. You will use antibiotic drops while the surface heals. We will check your eye and remove the bandage contact lens after one to two weeks. If the lens falls out, do not put it back in."
    time_off_work: "Most people take about a week off work."
  herpes_zoster:
    follow_up: "If your eye is affected, we will see you regularly in the eye clinic. If you are using steroid drops, we will reduce them slowly and keep checking your eye after they stop."
  herpes_simplex:
    follow_up: "We will usually check your eye again within a week or two to make sure the infection is healing. If you are using steroid drops, we will reduce them slowly and keep checking your eye."
  chemical_injury:
    follow_up: "We will usually check your eye again the next day. If the injury is more serious, we may admit you to hospital, and our cornea team will look after you."
  marginal_keratitis:
    follow_up: "If you are given steroid drops, we will usually check your eye, including the pressure in it, within one to two weeks."
  amniotic_membrane:
    while_in_place: |
      While the membrane is on your eye, please do not rub or press on the eye,
      keep water out of it when you wash, and do not swim or wear eye make-up.
      If a contact lens falls out, do not put it back in: call us instead.
      Wear glasses rather than your usual contact lenses until we tell you it is safe.
    follow_up: "We will check your eye in clinic, usually within a week, and remove any contact lens or ring when the surface has healed."

keratoconus:                           # this unit's own monitoring arrangements
  monitoring: "We usually check your eyes every 6 months while your keratoconus could still change, and less often once it is stable."
  lens_break_before_scans: "Please leave out rigid (hard) contact lenses for 2 weeks, and soft lenses for 1 week, before each scan appointment."
  who_you_see: "Your scans and checks will be done by our specialist optometrists, who work with the cornea consultants."

cxl:                                   # how and where this unit provides cross-linking
  where: "We carry out cross-linking here at the Example Eye Unit."
  technique: "We use the standard epithelium-off method, with an accelerated (shorter) ultraviolet treatment. You should expect to be in the department for about half a day."
  both_eyes: "We usually treat one eye at a time."

pterygium:                             # how this unit carries out pterygium surgery
  graft_fixation: "We usually hold the graft in place with a special tissue glue, sometimes with one or two dissolving stitches."
  mitomycin: "We do not routinely use mitomycin. If your surgeon recommends it, for example because your pterygium has come back, they will discuss it with you."
  tissue_to_lab: "We send the removed tissue to the laboratory to be checked."

recurrent_erosion:                     # which procedures this unit offers
  procedures_offered: "At the Example Eye Unit we offer alcohol delamination and PTK laser treatment. Your surgeon will discuss which is best for you."

ebmd:                                  # which procedures this unit offers for EBMD
  procedures_offered: "At the Example Eye Unit we offer removal of the loose surface with polishing, and PTK laser treatment. Your surgeon will discuss which is best for you."

suture_removal:                        # where and how this unit removes corneal stitches
  where: "We usually remove stitches in the clinic, sitting at the microscope, using numbing drops. It usually takes a few minutes. Occasionally we remove them in the operating theatre."

band_keratopathy:                      # where this unit carries out EDTA chelation
  where: "We carry out EDTA chelation in our day-case theatre, using numbing drops. You can usually go home the same day."

puk:                                   # how this unit shares care for PUK
  shared_care: "We work closely with the rheumatology team at the Example Eye Unit's hospital. Your GP will usually arrange your regular blood tests, following a plan agreed with the hospital."

blepharitis:                           # products and further treatments this unit suggests
  products: "Any clean flannel or a microwavable eye bag can be used for the warm compress. Eyelid cleaning wipes and solutions can be bought from pharmacies; ask us or your pharmacist if you are not sure which to use."

dry_eye:                               # local access to further treatments
  further_treatments: "If your dry eye is severe and does not improve with lubricants, we can discuss further treatments with you in the cornea clinic, including anti-inflammatory drops, plugs for the tear ducts and serum eye drops."

videos:                                # links to this hospital's recorded videos, by document
  # leaflet-corneal-cross-linking: "https://..."
