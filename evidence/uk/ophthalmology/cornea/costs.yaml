# Cornea cost and price figures used in business cases. See evidence/README.md for the rules and format.
# 'value' is how the figure reads in a document; 'detail' is the figure as published.
# NHS Blood and Transplant does not publish its tissue price list; ask NHSBT Tissue and Eye Services for current prices.

amniotic_membrane:
  dehydrated_application:
    description: Cost of one clinic application of dehydrated amniotic membrane (Omnigen) with its carrier lens (OmniLenz), including postage
    value: "£400"
    detail: "Omnigen £235; OmniLenz £120; postage £45 (price-base year not stated)"
    population: UK NHS, Queen Victoria Hospital and Maidstone and Tunbridge Wells, cost model in a published study
    source: "Maqsood SE, Posnett JW, Elalfy M. Management of ocular surface disease involving inflammation and persistent epithelial defects utilising various treatment modalities in the UK NHS. Eye (Lond). 2026;40(11):1627-1636. doi:10.1038/s41433-026-04314-6. Authors received a fellowship grant from NuVision Biotherapies (the manufacturer)."
    source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13415519/
    source_location: "Results: 'The cost of HAMDM and lens (Omnigen £235; OmniLenz £120; postage £45) totalled £400 per application.'"
    read: Full text
