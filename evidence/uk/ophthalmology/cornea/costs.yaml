  ped_standard_care_cost:
    description: Average cost per patient of standard care for a persistent epithelial defect with surface inflammation (including tarsorrhaphy and theatre amniotic membrane where used)
    value: "£4,900"
    detail: "£4900 ± £3363 per patient; complete healing 57%; mean 176 days and 10 outpatient visits; unit costs from 2017 NHS Reference Costs"
    population: 30 patients, retrospective, Queen Victoria Hospital and Maidstone and Tunbridge Wells, UK NHS
    source: "Maqsood SE, Posnett JW, Elalfy M. Eye (Lond). 2026;40(11):1627-1636. doi:10.1038/s41433-026-04314-6. Funded by a NuVision fellowship grant."
    source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13415519/
    source_location: "Abstract, Results: 'Conventional management achieved complete healing in 57% of patients, with a mean treatment duration of 176 ± 188 days and 10 OP visits per case ... The average total cost per patient was £ 4900 ± £ 3363.'"
    read: Full text
