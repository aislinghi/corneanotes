  ped_dehydrated_pathway_cost:
    description: Modelled average cost per patient when a persistent epithelial defect is treated with dehydrated amniotic membrane in clinic, including follow-up care
    value: "£2,508"
    detail: "£1623 to outcome; £2508 including follow-up intervention care (follow-up cost of £2249 carried over from the standard-care group); modelled against pooled earlier data"
    population: Cost model based on pooled earlier studies at the same two UK centres
    source: "Maqsood SE, Posnett JW, Elalfy M. Eye (Lond). 2026;40(11):1627-1636. doi:10.1038/s41433-026-04314-6. Funded by a NuVision fellowship grant."
    source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13415519/
    source_location: "Results: 'the average OP treatment cost per HAMDM patient was £1623 to outcome and £2508 including follow-up intervention care, representing a potential saving of £2392 per patient compared to SOC.'"
