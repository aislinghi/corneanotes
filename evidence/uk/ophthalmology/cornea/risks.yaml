# Cornea risk and outcome figures. See evidence/README.md for the rules and format.
# 'value' is how the figure reads in a patient leaflet; 'detail' is the figure as published.

dalk:
  conversion_manual:
    description: Operation changed to a full-thickness graft during surgery (manual technique)
    value: 1 in 4
    detail: 24.1% (UK multi-surgeon series, manual DALK)
    population: 357 eyes with keratoconus, Moorfields, 2012-2016, 42 surgeons including trainees
    source: 'Gadhvi KA, Romano V, Fernández-Vega Cueto L, Aiello F, Day AC, Allan BD. Deep anterior lamellar keratoplasty for keratoconus: multisurgeon results. Am J Ophthalmol. 2019;201:54-62. doi:10.1016/j.ajo.2019.01.022'
    source_url: https://pubmed.ncbi.nlm.nih.gov/30721690/
    source_location: 'Abstract, Results: ''A total of 24.1% were converted to penetrating keratoplasty (PK) intraoperatively.'''
